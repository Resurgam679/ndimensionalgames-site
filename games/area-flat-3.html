<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AREA FLAT 3 — Revival</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#07080c;height:100%;overflow:hidden;
            display:flex;align-items:center;justify-content:center;}
  canvas{cursor:crosshair;background:#000;display:block;box-shadow:0 0 40px rgba(0,0,0,.85);}
  canvas.chunky{image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* ============================================================
   AREA FLAT 3 — browser revival clone
   Controls: Mouse (move / hold left = shoot, right = laser,
   middle = bomb) or Keyboard (arrows/WASD move, Z shoot,
   X laser, B bomb). M mutes, P pauses.
   ============================================================ */
const cv = document.getElementById('game');
const g  = cv.getContext('2d');
const W = 640, H = 480, PW = 500;         // playfield width, HUD is PW..W
const CELL = 25, COLS = PW / CELL;        // terrain mosaic

// ---------- display harness (shared with the arcade shell) ----------
// ?size=fit|1..6  ?style=sharp|chunky ; the shell also pushes live updates
// over postMessage so changing a setting never kills a run.
let SCALE = 1;
(function display(){
  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  const q = new URLSearchParams(location.search);
  let size  = q.get('size')  || ls('fgr_size')  || 'fit';
  let style = q.get('style') || ls('fgr_style') || 'sharp';
  function apply(){
    let s = (size === 'fit')
      ? Math.min(innerWidth/W, innerHeight/H) * 0.985
      : (parseFloat(size) || 1);
    if(style === 'chunky'){
      s = Math.max(1, Math.floor(s));
      cv.width = W; cv.height = H;
      cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
      cv.classList.add('chunky');
      SCALE = 1;
    } else {
      s = Math.max(0.35, s);
      const dpr  = Math.min(3, window.devicePixelRatio || 1);
      const cssW = Math.round(W*s), cssH = Math.round(H*s);
      cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
      cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
      cv.classList.remove('chunky');
      SCALE = (cssW*dpr)/W;
    }
    g.imageSmoothingEnabled = false;
  }
  apply();
  addEventListener('resize', apply);
  addEventListener('message', e=>{
    const d = e.data;
    if(!d || d.t !== 'display') return;
    if(d.size)  size  = d.size;
    if(d.style) style = d.style;
    apply();
  });
})();
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
/* Tell the arcade we actually booted. It uses this as proof that framing us
   worked at all — Chrome on Android refuses to load a local file into a
   subframe, so the shell would render fine and then every game came up blank
   with no way for the shell to know. No hello, and the shell stops trying to
   frame us and opens us in the whole tab instead. */
if(window.parent && window.parent !== window)
  try{ window.parent.postMessage({t:'hello'}, '*'); }catch(e){}
function exitToArcade(){
  if(window.parent && window.parent !== window){ window.parent.postMessage({t:'exit'},'*'); return; }
  // running in the whole tab (the arcade's fallback path): the arcade is the
  // previous history entry, so step back to it rather than reloading it cold
  if(history.length > 1) history.back(); else location.href = 'index.html';
}

// ---------- utilities ----------
const rnd  = (a,b)=>a+Math.random()*(b-a);
const irnd = (a,b)=>Math.floor(rnd(a,b+1));
const clamp= (v,a,b)=>v<a?a:v>b?b:v;
const dist2= (x1,y1,x2,y2)=>{const dx=x1-x2,dy=y1-y2;return dx*dx+dy*dy;};
/* ---------------- drop shadows ----------------
   The original casts a SOLID BLACK silhouette down and to the left. Solid is
   the important part: overlapping pieces of one sprite stay flat black, so the
   whole thing is just a second pass with every colour forced to black — no
   alpha compositing or offscreen layer needed.
   Only things that FLY cast one; the parked land turret and the battleships
   sitting in the water do not. */
const SHX = -9, SHY = 15;
let SH = false;
function col(c){ return SH ? '#000000' : c; }
const GROUNDED = { turret:1, ship:1 };
function castsShadow(e){ return !GROUNDED[e.type]; }

/* Compact in place rather than rebuilding. The old code did
   `shots = shots.filter(...)` for shots, bullets, shards, texts, items,
   missiles and enemies EVERY frame — seven throwaway arrays a frame, each one
   garbage a moment later. Same semantics, no allocation. */
function sweep(a, keep){
  let w = 0;
  for(let i=0;i<a.length;i++){ const v = a[i]; if(keep(v)){ if(w!==i) a[w] = v; w++; } }
  a.length = w;
  return a;
}
function poly(pts, fill){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]);
  g.closePath(); g.fillStyle=col(fill); g.fill(); }

// ---------- persistent high score (falls back gracefully) ----------
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('af3hs')||'0',10)||0; } catch(e){}
function saveHS(){ try{ localStorage.setItem('af3hs',''+highScore); }catch(e){} }

// ---------- sound (owned by the arcade shell; on by default) ----------
// ?sound=on|off seeds it, postMessage updates it live, and toggling it in here
// reports back so the shell's control stays in agreement.
let soundOn = (new URLSearchParams(location.search).get('sound') || lsGet('fgr_sound') || 'on') === 'on';
let ac = null;
function setSound(on, tell){
  soundOn = !!on;
  lsSet('fgr_sound', soundOn ? 'on' : 'off');
  if(tell && window.parent && window.parent !== window)
    window.parent.postMessage({t:'sound', on:soundOn}, '*');
}
addEventListener('message', e=>{
  const d = e.data;
  if(d && d.t === 'sound') setSound(d.on, false);
});
/* ---- voices ----------------------------------------------------------------
   Every effect used to wire a fresh oscillator and gain straight to
   ac.destination and then just walk away. o.stop() silences a voice but does
   NOT unwire it, so the graph only ever grew: at a full rate of fire that is
   roughly 150 new nodes a second, and the audio thread walks all of them every
   render quantum. A long run therefore got progressively choppier — which is
   exactly the late-area lag. Now there is one master gain, every voice
   disconnects itself the moment it ends (with a timer as a backstop, because
   onended does not fire if the context is suspended), a hard cap on how many
   can ever be live at once, and a per-effect minimum gap so the gun cannot
   spawn a voice per bullet. */
const VOICES = 20;
let voices = 0, master = null;
const lastAt = Object.create(null);
function beep(type, freq, dur, vol, slide, tag, gap){
  if(!soundOn || voices >= VOICES) return;
  try{
    if(!ac){
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
    }
    if(ac.state === 'suspended') ac.resume();
    const now = ac.currentTime;
    if(tag){    // throttle repeats of one effect — on the WALL clock, because
                // ac.currentTime freezes whenever the context is suspended and
                // would then throttle the effect to permanent silence
      const t = performance.now();
      if(t - (lastAt[tag] || -1e9) < gap*1000) return;
      lastAt[tag] = t;
    }
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq+slide), now+dur);
    gn.gain.setValueAtTime(vol, now);
    gn.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(gn); gn.connect(master);
    voices++;
    let done = false;
    const release = () => {
      if(done) return; done = true; voices--;
      try{ o.disconnect(); gn.disconnect(); }catch(e){}
    };
    o.onended = release;
    setTimeout(release, (dur + 0.3) * 1000);
    o.start(now); o.stop(now + dur);
  }catch(e){}
}
const sfx = {
  /* Firing is the impact sound again, a major third higher and cut down. Same
     triangle, same downward slide, so the gun and what it lands on are plainly
     the same instrument — which is how the original read. No detune at all:
     one fixed pitch, because the character comes from the envelope, not from
     wobble. Level is matched by EAR to the old square-wave shot rather than by
     number: a triangle carries far less harmonic energy than a square at the
     same amplitude, so .045 of square needs roughly .085 of triangle to land in
     the same place. Still shorter than the impact, so the hits read on top. */
  shot : ()=>beep('triangle', 250, .06, .085, -190, 'shot', 0.05),
  boom : ()=>beep('sawtooth', 140, .3,  .12, -100, 'boom',  0.045),
  big  : ()=>beep('sawtooth',  80, .7,  .18,  -50),
  laser: ()=>beep('sawtooth', 220, .1,  .05,  200, 'laser', 0.08),
  item : ()=>beep('square',   660, .18, .08,  500),
  hit  : ()=>beep('triangle', 200, .15, .1,  -150, 'hit',   0.04),
  burn : ()=>beep('sawtooth', 190, .34, .09, -110),
};

// ---------- input ----------
const keys = {};
let mouseX = PW/2, mouseY = H-80, mouseInPlay = false, useMouse = false;
let mouseFire = false, mouseLaser = false;
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyB') bombRequest = true;
  if(e.code==='KeyM'){ setSound(!soundOn, true); }   // M, not S — S is 'fly down'
  if(e.code==='KeyP' && state==='play') paused = !paused;
  if(e.code==='Escape') exitToArcade();
  if(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ') startRequest = true;
  useMouse = false;
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX-r.left) * (W/r.width);
  mouseY = (e.clientY-r.top)  * (H/r.height);
  mouseInPlay = mouseX < PW;
  if(mouseInPlay) useMouse = true;
});
cv.addEventListener('mousedown', e=>{
  e.preventDefault();
  // sound toggle hotspot (bottom right HUD)
  if(mouseX>PW+20 && mouseY>H-30){ setSound(!soundOn, true); return; }
  startRequest = true;
  if(e.button===0) mouseFire  = true;
  if(e.button===2) mouseLaser = true;
  if(e.button===1) bombRequest = true;
});
addEventListener('mouseup', e=>{
  if(e.button===0) mouseFire  = false;
  if(e.button===2) mouseLaser = false;
});
cv.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- terrain (scrolling pixel mosaic, by biome) ----------
// One shared height field feeds every biome; the biome only decides which
// palette each height band maps to. So the same generator gives you rolling
// plains, a broken coastline, open ocean, ice shelves or a lava caldera.
const TP = {
  GRASS:['#1d7d1d','#218a21','#2a962a','#186f18','#249324'],
  MOSS :['#2f6b3a','#3a7d46','#265a30','#347040'],
  DIRT :['#8a6d3b','#9c7c3f','#7c5f30','#a8853f','#93733a'],
  SAND :['#d8c07a','#e6d090','#c7ac68','#efdca4'],
  SEA  :['#1533cc','#1c3cd8','#0f2ab4','#2244dd'],
  DEEP :['#0a1c6e','#0d2384','#07145c','#102a92'],
  BRINE:['#2a6ea8','#1e5c92','#3580bc','#246590'],
  FOAM :['#7fb0ff','#a8ccff','#6a9cf0','#c2dcff'],
  ICE  :['#bfe6f2','#d8f2fa','#a8d8ea','#e8f8ff'],
  FLOE :['#8fc8e0','#7ab4d2','#a2d6ea','#69a8c8'],
  SNOW :['#eef8ff','#ffffff','#dcecf6'],
  ASH  :['#3a3438','#46403f','#2e2a2e','#514a48'],
  ROCK :['#5a5258','#6a626a','#4a444a','#736a72'],
  LAVA :['#e04a10','#ff7a20','#c03408','#ff9030'],
  EMBER:['#ffc040','#ffe080','#ff9020'],
};
const WET = { SEA:1, DEEP:1, BRINE:1, LAVA:2 };     // 1 = water, 2 = molten
TP.SCORCH = ['#6b5828','#5a4a22','#7a6530','#4a3c1c','#63512a'];   // burnt ground
TP.CRATER = ['#1a1410','#241c14','#120e0a'];                        // blast cores
/* Tiles are stored as colour strings, so a reverse lookup lets a bomb work out
   what it just hit without changing the terrain data structure. */
const COL2KEY = (function(){
  const m = {};
  for(const k in TP) for(const c of TP[k]) m[c] = k;
  return m;
})();
/* A bomb burns the ground it goes off over: land chars, ice melts through to
   meltwater, and open water and lava are left alone. Rows keep their scars as
   they scroll, so the crater drifts away behind you. */
function scorch(cx, cy, R){
  const R2 = R*R, core2 = (R*0.34)*(R*0.34);
  for(let ri=0; ri<terrRows.length; ri++){
    const y = ri*CELL + terrOff - CELL + CELL/2;
    if(Math.abs(y-cy) > R) continue;
    const row = terrRows[ri];
    for(let c=0;c<COLS;c++){
      const x = c*CELL + CELL/2;
      const d2 = (x-cx)*(x-cx) + (y-cy)*(y-cy);
      if(d2 > R2) continue;
      const k = COL2KEY[row[c]];
      if(!k || WET[k] || k==='FOAM' || k==='EMBER' || k==='SCORCH' || k==='CRATER') continue;
      if(k==='ICE' || k==='FLOE' || k==='SNOW'){        // burns straight through
        row[c] = TP.BRINE[irnd(0,TP.BRINE.length-1)];
        continue;
      }
      const pal = (d2 < core2 && Math.random()<0.55) ? TP.CRATER : TP.SCORCH;
      row[c] = pal[irnd(0,pal.length-1)];
    }
  }
}
/* Bands are FRACTIONS of the landscape, not raw noise thresholds — "half of
   this area is water" is the thing you actually want to art-direct. The height
   field's distribution is nowhere near uniform, so we sample it once at load
   and turn those fractions into real thresholds. */
/* The original recurrence summed to exactly 1.0, i.e. an unbounded random walk:
   it could park at one end of its range for a whole screen, so an "ocean" could
   come up all sand. 0.695 gives it a gentle pull back toward the mean over ~40
   rows — still wandering and organic, but a screen now reads as its biome. */
const FIELD_KEEP = 0.695;
function stepField(col, drift){
  const nv = col.slice();
  for(let c=0;c<COLS;c++){
    const l = col[(c+COLS-1)%COLS], r = col[(c+1)%COLS];
    // drift is a slow REGIONAL bias (a wetter stretch, a drier stretch). Its
    // steady-state pull is weight/(1-persistence), so at 0.06 it would swamp
    // the whole range now that the field reverts. 0.012 lands it near +/-0.4.
    nv[c] = clamp(col[c]*FIELD_KEEP + (l+r)*0.14 + rnd(-.42,.42) + drift*0.012, -1.6, 1.9);
  }
  return nv;
}
const QUANT = (function(){
  let col = new Array(COLS).fill(0), drift = 0; const vals = [];
  for(let i=0;i<2600;i++){
    drift += rnd(-.16,.16); drift = clamp(drift,-.9,.9);
    col = stepField(col, drift);
    if(i>150) for(let c=0;c<COLS;c++) vals.push(col[c]);
  }
  vals.sort((a,b)=>a-b);
  const N = vals.length;
  return {
    at  : f => vals[clamp(Math.floor(f*(N-1)), 0, N-1)],          // fraction -> value
    frac: v => {                                                  // value -> fraction
      let lo=0, hi=N-1;
      while(lo<hi){ const m=(lo+hi)>>1; if(vals[m]<v) lo=m+1; else hi=m; }
      return lo/(N-1);
    }
  };
})();
const BIOMES = [
  { id:'plains', name:'VERDANT PLAINS', bands:[[0.12,'SEA'  ],[0.80,'GRASS'],[1,'DIRT']] },
  { id:'coast',  name:'BROKEN COAST',   wet:1, bands:[[0.46,'SEA'  ],[0.86,'GRASS'],[1,'SAND']] },
  { id:'ice',    name:'ICE SHELF',      wet:1, bands:[[0.26,'BRINE'],[0.86,'ICE'  ],[1,'SNOW']] },
  { id:'ocean',  name:'OPEN OCEAN',     wet:1, bands:[[0.90,'SEA'  ],[0.97,'SAND' ],[1,'MOSS']] },
  { id:'volc',   name:'THE CALDERA',    bands:[[0.24,'LAVA' ],[0.82,'ASH'  ],[1,'ROCK']] },
  { id:'delta',  name:'RIVER DELTA',    wet:1, bands:[[0.36,'SEA'  ],[0.80,'MOSS' ],[1,'SAND']] },
  { id:'floes',  name:'DRIFT ICE',      wet:1, bands:[[0.58,'BRINE'],[0.92,'FLOE' ],[1,'ICE' ]] },
  { id:'abyss',  name:'THE ABYSS',      wet:1, bands:[[0.60,'DEEP' ],[0.93,'SEA'  ],[1,'ROCK']] },
];
for(const b of BIOMES) b.th = b.bands.map(q=>[QUANT.at(q[0]), q[1]]);
const TERR_SPD = 1.6;                    // ground scroll; ships ride it
let terrCols = new Array(COLS).fill(0), terrRows = [], terrOff = 0, terrDrift = 0;
let bioCur = BIOMES[0], bioPrev = BIOMES[0], bioMix = 1;
function bandKey(bio, v){
  for(let i=0;i<bio.th.length;i++) if(v < bio.th[i][0]) return bio.th[i][1];
  return bio.th[bio.th.length-1][1];
}
function setBiome(i){
  const b = BIOMES[((i % BIOMES.length) + BIOMES.length) % BIOMES.length];
  if(b === bioCur) return;
  bioPrev = bioCur; bioCur = b; bioMix = 0;
  banner = b.name; bannerT = 150;
}
function makeRow(){
  terrDrift += rnd(-.16,.16); terrDrift = clamp(terrDrift,-.9,.9);
  terrCols = stepField(terrCols, terrDrift);
  if(bioMix < 1) bioMix = Math.min(1, bioMix + 1/30);
  const keys = [];
  for(let c=0;c<COLS;c++){
    const v = terrCols[c] + rnd(-.12,.12);
    // the new biome floods in from the LOW ground up, so a coastline advances
    // along the contours instead of dissolving in as noise
    keys.push(bandKey(QUANT.frac(terrCols[c]) < bioMix ? bioCur : bioPrev, v));
  }
  const row = [];
  for(let c=0;c<COLS;c++){
    let k = keys[c];
    const w = WET[k];
    if(w){                                   // surf line / molten crust edge
      const l = keys[c-1], r = keys[c+1];
      if((l && !WET[l]) || (r && !WET[r])) k = (w === 2 ? 'EMBER' : 'FOAM');
    }
    const pal = TP[k];
    row.push(pal[irnd(0,pal.length-1)]);
  }
  return row;
}
function initTerrain(){
  terrCols = terrCols.map(()=>rnd(-1,1.4));
  bioPrev = bioCur = BIOMES[0]; bioMix = 1;
  terrRows = [];
  for(let i=0;i<Math.ceil(H/CELL)+2;i++) terrRows.unshift(makeRow());
  terrOff = 0;
}
function updateTerrain(speed){
  terrOff += speed;
  while(terrOff >= CELL){ terrOff -= CELL; terrRows.pop(); terrRows.unshift(makeRow()); }
}
/* One fillStyle change per DISTINCT COLOUR rather than one per cell. The mosaic
   is 20x21 cells, so the old loop set fillStyle 420 times and issued 420
   fillRects every frame — on its own about 40% of the whole frame. The palettes
   only hold a handful of colours, so we bucket the cells by colour, merge
   horizontal runs, and stroke each colour as a single path: roughly 15 state
   changes instead of 420. The buckets are reused frame to frame so this costs
   no allocation. */
const terrBucket = new Map();
function drawTerrain(){
  for(const a of terrBucket.values()) a.length = 0;
  for(let ri=0;ri<terrRows.length;ri++){
    const y = ri*CELL + terrOff - CELL;
    if(y>H) break;
    const row = terrRows[ri];
    let c = 0;
    while(c < COLS){
      const k = row[c];
      let e = c+1;
      while(e < COLS && row[e] === k) e++;      // merge the horizontal run
      let a = terrBucket.get(k);
      if(!a){ a = []; terrBucket.set(k, a); }
      a.push(c*CELL, y, (e-c)*CELL + 1);
      c = e;
    }
  }
  for(const [k, a] of terrBucket){
    if(!a.length) continue;
    g.fillStyle = k;
    g.beginPath();
    for(let i=0;i<a.length;i+=3) g.rect(a[i], a[i+1], a[i+2], CELL+1);
    g.fill();
  }
}


/* ---------------- gamepad ----------------
   Polled rather than event-driven, because that's all the Gamepad API offers.
   Analog stick with a deadzone, d-pad as a digital fallback, and edge-detection
   on the buttons that should fire once per press rather than per frame.
   Note: browsers only expose pads after a gesture in THIS document, so the pad
   wakes up on the first button press. */
const PAD = { x:0, y:0, fire:false, laser:false, bomb:false, start:false, on:false };
const padPrev = { bomb:false, start:false, alt:false };
/* Owned by the arcade shell like sound is: ?pad=on|off seeds it, postMessage
   toggles it live, and we report back whenever a pad appears or disappears so
   the shell can show whether one is actually live. */
let padEnabled = (new URLSearchParams(location.search).get('pad')
                  || lsGet('fgr_pad') || 'on') !== 'off';
let padSeen = false;
function padTell(on){
  if(on === padSeen) return;
  padSeen = on;
  if(window.parent && window.parent !== window)
    window.parent.postMessage({t:'padstate', on}, '*');
}
addEventListener('message', e=>{
  const d = e.data;
  if(!d || d.t !== 'padset') return;
  padEnabled = !!d.on;
  lsSet('fgr_pad', padEnabled ? 'on' : 'off');
  if(!padEnabled) padTell(false);
});
function pollPad(){
  if(!padEnabled){ PAD.on=false; PAD.x=PAD.y=0; PAD.fire=PAD.laser=false; PAD.bomb=PAD.start=false; return; }
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for(const p of list) if(p && p.connected){ gp = p; break; }
  PAD.on = !!gp;
  padTell(!!gp);
  if(!gp){ PAD.x=PAD.y=0; PAD.fire=PAD.laser=false; PAD.bomb=PAD.start=false; return; }
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const dz = 0.22;
  const ax = gp.axes[0]||0, ay = gp.axes[1]||0;
  PAD.x = Math.abs(ax)>dz ? ax : 0;
  PAD.y = Math.abs(ay)>dz ? ay : 0;
  if(btn(14)) PAD.x = -1;  if(btn(15)) PAD.x = 1;     // d-pad overrides
  if(btn(12)) PAD.y = -1;  if(btn(13)) PAD.y = 1;
  PAD.fire  = btn(0) || btn(7);                        // A / right trigger
  PAD.laser = btn(2) || btn(6) || btn(5);              // X / left trigger / RB
  const bombNow  = btn(1) || btn(4);                   // B / LB
  const startNow = btn(9) || btn(8);                   // start / select
  PAD.bomb  = bombNow  && !padPrev.bomb;
  PAD.start = startNow && !padPrev.start;
  padPrev.bomb = bombNow; padPrev.start = startNow;
}

// ---------- game state ----------
let state='title', paused=false, frame=0, startRequest=false, bombRequest=false;
let score=0, lives=3, bombs=3, nextLifeAt=20000;
let laserGauge=50, laserOn=false, laserXp=0, laserLock=false;
let area=1, areaProg=0, bossActive=false, bossWarn=0;
let shipX=PW/2, shipY=H-70, shipR=9, shipDead=0, inv=0, fireCd=0, power=1;
let shipBank=0, shipPX=PW/2;      // pivot as it banks left and right
let shots=[], enemies=[], ebullets=[], items=[], shards=[], texts=[], missiles=[];
let mslCd=0, mslSide=1;
let spawnCd=60, flash=0, shake=0;
let banner='', bannerT=0, bossName='';
const BOMBMAX = 3;          // 3 reads better on the HUD than 6
const LIVEMAX = 6;          // 6 icons would overflow the 140px HUD panel, hence "x4"

/* ---- primary weapon ------------------------------------------------------
   Follows the original's progression: a single thin WHITE vertical line, which
   thickens into a wall of slightly offset lines, and then converts to the
   YELLOW spread gun at full power. */
const GUN = [ null,
  { cd:7, col:'#ffffff', w:2.0, dmg:1, lanes:[0],                 spread:0    },
  { cd:6, col:'#ffffff', w:2.0, dmg:1, lanes:[-4,4],              spread:0    },
  { cd:5, col:'#ffffff', w:2.0, dmg:1, lanes:[-9,-3,3,9],         spread:0    },
  { cd:5, col:'#ffee00', w:3.0, dmg:2, lanes:[-6,0,6],            spread:0.12 },
  { cd:4, col:'#ffee00', w:3.5, dmg:2, lanes:[-13,-6,0,6,13],     spread:0.13 },
];
const GUNMAX   = 5;        // top firing PATTERN
const GUNRAPID = 6;        // one refire step past it, and that's the rate-of-fire cap
const MSLMAX   = 4;        // then power feeds homing missiles instead
const GUNCAP   = GUNRAPID + MSLMAX;
function gunSpec(){
  const G = GUN[clamp(power,1,GUNMAX)];
  // floor of 3, not 2 — the extra step made the whole game read as easy
  return { G, cd: Math.max(3, G.cd - Math.max(0, Math.min(power,GUNRAPID) - GUNMAX)) };
}
function mslTier(){ return clamp(power - GUNRAPID, 0, MSLMAX); }
/* ---- laser ---------------------------------------------------------------
   Tiers up from how many L pickups you've banked and how deep you've got. */
const LASER = [ null,
  { name:'AMBER',   col:'#eeb400', hot:'#ffe680', w:36, dmg:0.55, drain:0.55 },
  { name:'FUCHSIA', col:'#ff3ec8', hot:'#ffb0e8', w:48, dmg:1.15, drain:0.60 },
  { name:'CYAN',    col:'#28e8ff', hot:'#ccf8ff', w:62, dmg:2.00, drain:0.68 },
  { name:'PLASMA',  col:'#a878ff', hot:'#ffffff', w:78, dmg:3.10, drain:0.80 },
];
const LASERMAX = 4, LASEROVER = 6;   // tiers, then bonus steps
// Purely earned from L pickups — no free tiers for surviving — so that dying
// can take the whole thing away.
function laserRaw(){ return 1 + Math.floor(laserXp/2); }
function laserLv(){ return clamp(laserRaw(), 1, LASERMAX); }
// Past the top tier, every further pickup alternates a wider beam and a harder
// one, so the laser keeps paying off instead of the pickups going to waste.
function laserOver(){ return clamp(laserRaw()-LASERMAX, 0, LASEROVER); }
/* Past the top tier the laser does NOT get stronger — it just covers a little
   more of the screen with each pickup, which is worth having without turning
   into an infinitely scaling win button. */
function laserSpec(){
  const B = LASER[laserLv()], o = laserOver();
  if(!o) return B;
  return { name:B.name, col:B.col, hot:B.hot, drain:B.drain, dmg:B.dmg, w:B.w + o*9 };
}
// enemy fire rates tighten with the area — gently, and with a real floor
function fr(base){ return Math.max(22, Math.round(base - area*2.8)); }
// enemy toughness has to keep pace with the gun, which gets ~15x stronger
function eHp(base, per){ return Math.round(base + per*(area-1)); }

function resetGame(){
  score=0; lives=3; bombs=3; power=1; nextLifeAt=20000;
  laserGauge=50; laserOn=false; laserXp=0; laserLock=false;
  area=1; areaProg=0; bossActive=false; bossWarn=0; bossName='';
  shipX=PW/2; shipY=H-70; shipDead=0; inv=120; fireCd=0; shipBank=0; shipPX=PW/2;
  shots=[];enemies=[];ebullets=[];items=[];shards=[];texts=[];missiles=[];
  mslCd=0; mslSide=1;
  spawnCd=50; flash=0; shake=0; banner=''; bannerT=0; shockPending=false; initTerrain();
}

// ---------- explosions (triangle shards, like the original) ----------
const SHARDMAX = 420;                // debris is transient, but cap the spike
function burst(x,y,colors,n,sp){
  n = Math.min(n, SHARDMAX - shards.length);
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2), s=rnd(sp*.3,sp);
    shards.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      rot:rnd(0,Math.PI*2), vr:rnd(-.3,.3), size:rnd(5,16),
      col:colors[irnd(0,colors.length-1)], life:irnd(20,40)});
  }
}
function addText(x,y,str,col){ texts.push({x,y,str,col,life:50}); }

/* Decide what a drop IS at the moment it spawns. If bombs are already full the
   bomb never appears in the first place — the player sees the laser or power
   icon fall, rather than a bomb that quietly turns into something else on
   contact. (The pickup-side conversion stays as a safety net for the narrow
   case where bombs fill up while this one is still in the air.) */
/* How kitted-out you currently are, 0..1. Drops thin out as this rises so that
   each one you do get counts for more — and because dying resets your weapons,
   the rate springs back exactly when you need it to. */
function loadout(){
  const g = (clamp(power,1,GUNCAP)-1) / (GUNCAP-1);
  const l = clamp(laserXp,0,(LASERMAX-1+LASEROVER)*2) / ((LASERMAX-1+LASEROVER)*2);
  return clamp(g*0.55 + l*0.45, 0, 1);
}
function wantsDrop(base){ return Math.random() < base * (1 - 0.45*loadout()); }
function dropKind(){
  const r = Math.random();
  let k = r<.40 ? 'P' : r<.74 ? 'L' : 'B';
  if(k==='B' && bombs>=BOMBMAX) k = Math.random()<0.5 ? 'L' : 'P';
  return k;
}

// ---------- enemies ----------
function spawnEnemy(){
  const lv = area, x = rnd(30, PW-30);
  const pool = []; const add=(t,w)=>{ for(let i=0;i<Math.max(0,w);i++) pool.push(t); };
  add('orb', 6); add('redY', 6); add('dart', 5); add('tank', 3);
  if(lv>=2){ add('hex',      lv-1); }      // the heavies arrive one at a time,
  if(lv>=3){ add('weaver',   lv-2); }      // so each one gets to be an event
  if(lv>=4){ add('splitter', lv-3); }
  if(lv>=5){ add('turret',   lv-4); }
  // battleships: mini-mini-bosses, only where there's water to float them
  if(lv>=4 && bioCur.wet && enemies.filter(e=>e.type==='ship').length < 3) add('ship', 1);
  const t = pool[irnd(0,pool.length-1)];
  if(t==='orb'){
    enemies.push({type:'orb', x, y:-20, vx:rnd(-.7,.7), vy:rnd(1,1.6)+lv*.08,
      hp:eHp(1,0.45), r:11, cd:fr(80), pts:100});
  } else if(t==='redY'){
    enemies.push({type:'redY', x, y:-20, base:x, ph:rnd(0,6.28),
      vy:rnd(1.6,2.4)+lv*.12, hp:eHp(1,0.5), r:16, cd:fr(70), pts:150});
  } else if(t==='dart'){
    enemies.push({type:'dart', x, y:-20, vx:(shipX-x)/240, vy:rnd(3,4.2)+lv*.15,
      hp:eHp(1,0.35), r:9, cd:9999, pts:80});
  } else if(t==='tank'){
    enemies.push({type:'tank', x, y:-24, vx:rnd(-.5,.5), vy:.8,
      hp:eHp(5,3), r:16, cd:fr(95), pts:300, drop:wantsDrop(0.95)});
  } else if(t==='hex'){                 // heavy cruiser — 3-round aimed bursts
    enemies.push({type:'hex', x, y:-34, vx:rnd(-.55,.55), vy:rnd(.6,1.0)+lv*.05,
      hp:eHp(9,5), r:23, cd:fr(95), burst:0, pts:600, drop:wantsDrop(0.4)});
  } else if(t==='weaver'){              // dashes to a new station, then sprays
    enemies.push({type:'weaver', x, y:-26, stopY:rnd(60,130),
      tx:x, ty:rnd(60,130), trail:[], vy:1.3,
      hp:eHp(16,8), r:16, cd:fr(60), pts:400});
  } else if(t==='splitter'){            // breaks into two darts when killed
    enemies.push({type:'splitter', x, y:-24, vx:rnd(-.8,.8), vy:1.5+lv*.1,
      hp:eHp(5,3), r:15, cd:fr(105), pts:350, splits:true});
  } else if(t==='turret'){              // turret — parks and shells you
    enemies.push({type:'turret', x, y:-40, vy:1.0, stopY:rnd(70,150), ang:0,
      hp:eHp(16,8), r:26, cd:fr(80), cd2:fr(165), pts:900, drop:wantsDrop(0.5)});
  } else {                              // battleship — kill the guns, then the hull
    /* Both variants ride the scrolling water rather than hovering, so they pass
       by and you either finish them or you don't. Ram one and you die.
        - BROADSIDE slides in from a flank, brakes, and shells you side-on while
          the terrain carries it down at full scroll speed.
        - VERTICAL is under way in the same direction as you, so it falls behind
          more slowly than the land does. */
    const vert = Math.random() < 0.45;
    const face = Math.random() < 0.5 ? -1 : 1;
    const hull = eHp(150, 55), th = eHp(16, 5);
    const spots = vert ? [[-7,-58],[7,-20],[-7,20],[7,58]]
                       : [[-62,-6],[-21,8],[21,-6],[62,8]];
    enemies.push({ type:'ship', vert, face,
      x: vert ? rnd(90, PW-90) : (face>0 ? -120 : PW+120),
      y: vert ? -110 : -50,
      vx: vert ? 0 : face*3.4,
      vy: vert ? 0.85 : TERR_SPD,        // vertical ships are making way
      tx: vert ? 0 : rnd(130, PW-130),
      hp:hull, hpMax:hull, r:46, pts:2200, drop:wantsDrop(0.9),
      turrets: spots.map((q,i)=>({ ox:q[0], oy:q[1], x:0, y:0,
        hp:th, hpMax:th, cd:fr(75)+i*16 })) });
    addText(PW/2, 76, 'BATTLESHIP', '#ffd700');
  }
}

/* ---- bosses: one per area, cycling through five very different fights ---- */
const BOSSES = ['tri','hive','orbital','serpent','fortress'];
const BOSSNAME = { tri:'TRIFOIL', hive:'HIVE CARRIER', orbital:'ORBITAL CROWN',
                   serpent:'SEA SERPENT', fortress:'BULWARK' };
function spawnBoss(){
  const kind = BOSSES[(area-1) % BOSSES.length];
  /* The gun goes from ~9 dps at tier 1 to ~150 at tier 5, and the laser adds up
     to 120 on top, so flat-ish boss hp made late bosses evaporate. This curve
     keeps a fight in the 25-60 second range the whole way up. */
  const hp = Math.round((260 + 300*Math.pow(area-1, 1.55))
                        * (kind==='fortress'?1.35 : kind==='serpent'?1.1 : 1));
  const e = { type:'boss', boss:kind, x:PW/2, y:-90, vx:1.1, vy:.8,
              hp, hpMax:hp, r:52, cd:50, cd2:130, cd3:90, ph:0,
              pts:5000+area*1000 };
  if(kind==='orbital'){
    e.r = 34;
    const ph = Math.round(hp*0.20);      // each pod is a fifth of the crown's bar
    e.pods = [0,1,2,3].map(i=>({ a:i*Math.PI/2, x:0, y:0, hp:ph, hpMax:ph }));
  }
  if(kind==='serpent'){
    e.r = 22; e.trail = []; e.segs = [];
    e.nseg = 7 + Math.min(5, area);
  }
  if(kind==='fortress'){ e.r = 66; e.vx = 0.7; }
  if(kind==='hive'){ e.r = 46; e.spawnCd = 80; }
  enemies.push(e);
  bossActive = true; bossName = BOSSNAME[kind];
}
/* How hard each type leans into a turn. Anything absent flies flat: a turret is
   bolted down, a battleship has its own heading, orbs are spheres. */
const PIVOT = { redY:1.0, weaver:1.0, dart:0.9, splitter:0.6, hex:0.45, tank:0.4 };
function updateBank(e){
  const k = PIVOT[e.type];
  if(!k){ e.bank = 0; return; }
  if(e.px === undefined) e.px = e.x;
  e.bank += (clamp((e.x-e.px)/2.6, -1, 1)*k - e.bank) * 0.20;
  e.px = e.x;
}
function eShoot(e, kind, ox, oy){
  const sx = e.x + (ox||0), sy = e.y + (oy||0);
  const a = Math.atan2(shipY-sy, shipX-sx);
  if(kind==='aim'){
    ebullets.push({x:sx,y:sy,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:5,col:'#ee1111'});
  } else if(kind==='cyan'){
    ebullets.push({x:sx,y:sy,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,r:7,col:'#28e0e0'});
  } else if(kind==='heavy'){                       // slow fat shell
    ebullets.push({x:sx,y:sy,vx:Math.cos(a)*2.3,vy:Math.sin(a)*2.3,r:10,col:'#ff8a20'});
  } else if(kind==='spray'){                       // 5-wide fan
    for(let i=-2;i<=2;i++){
      const b = a + i*0.21;
      ebullets.push({x:sx,y:sy,vx:Math.cos(b)*2.7,vy:Math.sin(b)*2.7,r:5,col:'#28e0e0'});
    }
  } else if(kind==='ring'){
    const n = 10 + area*2;
    for(let i=0;i<n;i++){
      const b = a + i*(Math.PI*2/n);
      ebullets.push({x:sx,y:sy,vx:Math.cos(b)*2.4,vy:Math.sin(b)*2.4,r:5,col:'#ee1111'});
    }
  } else if(kind==='wall'){                        // curtain with a gap to fly
    const n = 9, gap = irnd(0, n-2);
    for(let i=0;i<n;i++){
      if(i===gap || i===gap+1) continue;
      ebullets.push({x:22 + i*(PW-44)/(n-1), y:sy, vx:0, vy:2.5, r:6, col:'#ee44aa'});
    }
  } else if(kind==='spiral'){
    e.ph = (e.ph||0) + 0.55;
    for(let i=0;i<3;i++){
      const b = e.ph + i*(Math.PI*2/3);
      ebullets.push({x:sx,y:sy,vx:Math.cos(b)*2.6,vy:Math.sin(b)*2.6,r:5,col:'#ffd700'});
    }
  }
}
/* Enemies with destructible parts expose them here for hit testing.
   ORDER MATTERS: sub-parts must come before the core, because collision takes
   the first overlapping part. The battleship's inner turrets sit inside the
   hull's own radius — list the hull first and those two turrets become
   unhittable, since every shot sparks off the shielded hull instead. */
function enemyParts(e){
  if(e.boss==='serpent'){
    const a=[];
    for(const sg of (e.segs||[])) a.push({x:sg.x,y:sg.y,r:13});
    a.push({x:e.x,y:e.y,r:e.r,core:true});
    return a;
  }
  if(e.boss==='orbital'){
    const a=[];
    for(const pd of e.pods) if(pd.hp>0) a.push({x:pd.x,y:pd.y,r:17,pod:pd});
    a.push({x:e.x,y:e.y,r:e.r,core:true});
    return a;
  }
  if(e.type==='ship'){
    const a=[];
    for(const tu of e.turrets) if(tu.hp>0) a.push({x:tu.x,y:tu.y,r:18,turret:tu});
    // long thin hull: three circles down its axis fit it far better than one
    const seg = e.vert ? [[0,-52],[0,0],[0,52]] : [[-52,0],[0,0],[52,0]];
    for(const q of seg) a.push({x:e.x+q[0], y:e.y+q[1], r:27, core:true});
    return a;
  }
  return [{x:e.x,y:e.y,r:e.r,core:true}];
}
function podsLeft(e){ return e.boss==='orbital' && e.pods.some(p=>p.hp>0); }
function gunsLeft(e){ return e.type==='ship' && e.turrets.some(t=>t.hp>0); }
/* Hull/core is untouchable until its parts are gone. */
function shielded(e){ return podsLeft(e) || gunsLeft(e); }
/* ---- boss behaviour: five distinct fights ------------------------------- */
function bossUpdate(e){
  const K = e.boss;
  if(K==='serpent'){
    // snakes across the screen; the body trails the head along its own path
    e.ph += 0.021;
    e.x = PW/2 + Math.sin(e.ph)*(PW/2-46);
    e.y = 74 + Math.sin(e.ph*2.3)*34;
    e.trail.unshift({x:e.x,y:e.y});
    if(e.trail.length > 200) e.trail.pop();
    e.segs = [];
    for(let i=1;i<=e.nseg;i++){
      const t = e.trail[Math.min(e.trail.length-1, i*11)];
      if(t) e.segs.push({x:t.x,y:t.y});
    }
    if(--e.cd<=0){ eShoot(e,'aim'); eShoot(e,'spray'); e.cd=Math.max(20,54-area*3); }
    if(--e.cd2<=0){ eShoot(e,'spiral'); e.cd2=Math.max(26,60-area*3); }
    return;
  }
  if(K==='fortress'){
    if(e.y<58) e.y+=e.vy; else { e.x+=e.vx; if(e.x<90||e.x>PW-90) e.vx*=-1; }
    if(e.y>40){
      if(--e.cd<=0){ eShoot(e,'wall',0,34); e.cd=Math.max(52,118-area*7); }
      if(--e.cd2<=0){ eShoot(e,'aim',-52,26); eShoot(e,'aim',52,26); e.cd2=Math.max(22,54-area*4); }
      if(--e.cd3<=0){ eShoot(e,'heavy',0,30); e.cd3=Math.max(60,140-area*8); }
    }
    return;
  }
  if(K==='orbital'){
    if(e.y<98) e.y+=e.vy; else { e.x+=e.vx; if(e.x<86||e.x>PW-86) e.vx*=-1; }
    e.ph += 0.019;
    const live = e.pods.filter(p=>p.hp>0).length;
    const R = 62 + (4-live)*5;
    for(const pd of e.pods){
      pd.x = e.x + Math.cos(pd.a + e.ph)*R;
      pd.y = e.y + Math.sin(pd.a + e.ph)*R*0.72;
    }
    if(e.y>60){
      if(--e.cd<=0){                       // each surviving pod fires
        for(const pd of e.pods) if(pd.hp>0) eShoot(e,'aim', pd.x-e.x, pd.y-e.y);
        e.cd = Math.max(24, 64-area*4);
      }
      // stripped of its pods the core goes berserk
      if(--e.cd2<=0){ eShoot(e, live?'ring':'spiral'); e.cd2 = live?Math.max(80,150-area*8):26; }
    }
    return;
  }
  if(K==='hive'){
    if(e.y<80) e.y+=e.vy; else { e.x+=e.vx; if(e.x<74||e.x>PW-74) e.vx*=-1; }
    if(e.y>50){
      if(--e.cd<=0){ eShoot(e,'aim',-34,18); eShoot(e,'aim',34,18); e.cd=Math.max(20,50-area*3); }
      if(--e.cd2<=0){ eShoot(e,'spray',0,22); e.cd2=Math.max(60,120-area*7); }
      if(--e.spawnCd<=0){                  // launches escorts from its bays
        e.spawnCd = Math.max(46, 110-area*8);
        for(const sd of [-1,1])
          enemies.push({type:'orb', x:e.x+sd*30, y:e.y+16, vx:sd*0.6, vy:1.3,
            hp:eHp(1,0.45), r:11, cd:fr(90), pts:100});
      }
    }
    return;
  }
  // 'tri' — the original trifoil
  if(e.y<95) e.y+=e.vy; else { e.x+=e.vx; if(e.x<80||e.x>PW-80) e.vx*=-1; }
  if(e.y>60){
    if(--e.cd<=0){ eShoot(e,'aim'); eShoot(e,'aim'); e.cd=Math.max(18,42-area*3); }
    if(--e.cd2<=0){ eShoot(e,'ring'); e.cd2=Math.max(90,170-area*10); }
  }
}
function killEnemy(e){
  score += e.pts; addText(e.x, e.y, ''+e.pts, '#ffffff');
  laserGauge = clamp(laserGauge + (e.type==='boss'?30:3), 0, 100);
  if(e.type==='boss'){
    burst(e.x,e.y,['#ffffff','#28e0e0','#ee1111','#111111','#00cc44'],52,7);
    burst(e.x,e.y,['#ffffff','#ffd700'],22,4);
    sfx.big(); shake=24; flash=12;
    bossActive=false; bossName=''; area++; areaProg=0; bombs=Math.min(bombs+1,BOMBMAX);
    addText(PW/2, H/2, 'AREA '+(area-1)+' CLEAR', '#ffff00');
    setBiome(area-1);                       // new area, new landscape
    for(let i=0;i<2;i++)
      items.push({x:e.x+rnd(-40,40), y:e.y, vy:1.0, kind: i?'L':'P', ph:0});
  } else {
    const cols = e.type==='redY'     ? ['#ee1111','#ffffff','#111111','#00cc44']
              : e.type==='orb'      ? ['#28e0e0','#ffffff','#111111']
              : e.type==='dart'     ? ['#ffffff','#dddddd','#111111']
              : e.type==='hex'      ? ['#8ad8f0','#ffffff','#ee1111','#28506a']
              : e.type==='weaver'   ? ['#ff42d2','#ffffff','#111111','#7a1060']
              : e.type==='splitter' ? ['#00cc44','#ffffff','#111111']
              : e.type==='turret'   ? ['#aaaaaa','#ffd700','#111111','#555555']
              : e.type==='ship'     ? ['#6d7c88','#ffd700','#ffffff','#2b3238','#ee1111']
              : ['#ffd700','#aaaaaa','#ffffff','#111111'];
    const big = e.type==='tank'||e.type==='hex'||e.type==='turret';
    if(e.type==='ship'){
      for(const tu of e.turrets) burst(tu.x, tu.y, cols, 10, 5);
      burst(e.x,e.y,cols,40,8); burst(e.x,e.y,['#ffffff','#ffd700'],16,4);
      sfx.big(); shake=18; flash=8;
    } else {
      burst(e.x,e.y,cols, big?24:12, big?5:4);
      sfx.boom();
    }
    if(e.splits){                           // breaks into two angry darts
      for(const sd of [-1,1])
        enemies.push({type:'dart', x:e.x+sd*10, y:e.y, vx:sd*1.5, vy:2.6+area*.12,
          hp:eHp(1,0.35), r:9, cd:9999, pts:60});
    }
    if(e.drop) items.push({x:e.x, y:e.y, vy:1.1, kind:dropKind(), ph:0});
  }
  if(score>highScore){ highScore=score; saveHS(); }
}
/* Checked every frame, not just on a kill — score also comes from pickups, and
   an extra life shouldn't sit waiting for you to shoot something. */
function checkExtraLife(){
  if(score < nextLifeAt) return;
  nextLifeAt += 30000;
  if(lives < LIVEMAX){ lives++; addText(shipX, shipY-30, '1UP', '#00ff66'); }
  else { score += 5000; addText(shipX, shipY-30, 'BONUS', '#ffd700'); }
  sfx.item();
}

// ---------- player ----------
let shockPending = false;
function hitPlayer(){
  if(inv>0 || shipDead>0) return;
  burst(shipX,shipY,['#ffb0a0','#ffffff','#28e0e0','#111111'],26,5);
  sfx.big(); shake=22; flash=20;
  lives--; shipDead=80; laserOn=false;
  shockPending = true;                 // your wreck takes the screen with it
  if(lives<0){ state='gameover'; saveHS(); }
}
/* Deferred to the end of update(): hitPlayer can fire from inside the enemy and
   bullet loops, and reassigning those arrays mid-iteration would be undone. */
function shockwave(){
  ebullets.length = 0;
  scorch(shipX, shipY, 135);          // your wreck scars the ground too
  burst(shipX, shipY, ['#ffffff','#ffd700','#28e0e0','#ee1111'], 34, 9);
  for(const e of enemies){
    if(e.type==='boss') continue;      // bosses ride it out untouched
    burst(e.x, e.y, ['#ffffff','#ffd700','#ee1111'], 9, 4);
    e.gone = true;                     // vaporised, but no points: this isn't a reward
  }
  sweep(enemies, e => !e.gone);
}
function updatePlayer(){
  if(shipDead>0){
    shipDead--;
    if(shipDead===0 && lives>=0){
      shipX=PW/2; shipY=H-70; inv=140;
      power = Math.max(1, power-1);      // gun drops a tier...
      laserXp = 0;                       // ...and the laser goes all the way back
      laserGauge = 50; laserLock = false;
    }
    return;
  }
  if(inv>0) inv--;
  const spd = 4.6;
  let kx=0, ky=0;
  if(keys['ArrowLeft']||keys['KeyA']) kx-=1;
  if(keys['ArrowRight']||keys['KeyD']) kx+=1;
  if(keys['ArrowUp']||keys['KeyW']) ky-=1;
  if(keys['ArrowDown']||keys['KeyS']) ky+=1;
  if(PAD.x || PAD.y){ useMouse=false;
    const n = Math.max(1, Math.hypot(PAD.x, PAD.y));
    shipX += PAD.x/n*spd; shipY += PAD.y/n*spd;
  } else if(kx||ky){ useMouse=false;
    const n=Math.hypot(kx,ky); shipX+=kx/n*spd; shipY+=ky/n*spd;
  } else if(useMouse && mouseInPlay){
    shipX += (mouseX-shipX)*0.35; shipY += (mouseY-shipY)*0.35;
  }
  shipX = clamp(shipX, 21, PW-21); shipY = clamp(shipY, 30, H-24);
  shipBank += (clamp((shipX-shipPX)/4.6, -1, 1) - shipBank) * 0.20;
  shipPX = shipX;

  // shooting
  const wantFire = PAD.fire || keys['KeyZ']||keys['Space']||mouseFire;
  if(fireCd>0) fireCd--;
  if(wantFire && fireCd===0){
    const { G, cd } = gunSpec();
    fireCd = cd;
    for(const L of G.lanes)
      shots.push({ x:shipX+L, y:shipY-21, vx:L*G.spread, vy:-12,
                   col:G.col, w:G.w, dmg:G.dmg });
    sfx.shot();
  }
  // laser
  /* Run it dry and it locks out until the gauge is FULL again — so the laser is
     something you spend in judged bursts, not a button you lean on. */
  const LS = laserSpec();
  const wantLaser = PAD.laser || keys['KeyX']||mouseLaser;
  laserOn = wantLaser && laserGauge>0 && !laserLock;
  if(laserOn){
    laserGauge -= LS.drain;
    if(frame%6===0) sfx.laser();
    if(laserGauge<=0){ laserGauge=0; laserOn=false; laserLock=true; sfx.burn(); }
  } else {
    laserGauge = clamp(laserGauge+0.07, 0, 100);
    if(laserLock && laserGauge>=100) laserLock=false;
  }
  /* Homing missiles. Power past the rate-of-fire cap opens launch rails; they
     alternate left and right, arc onto a random enemy, and — deliberately — do
     not fire at all when the screen is empty. */
  if(mslTier()>0 && shipDead===0){
    if(--mslCd<=0){
      const live = enemies.filter(e=>e.y>-12 && e.y<H-16 && e.hp>0);
      if(live.length){
        if(missiles.length < 2 + mslTier()*3){
          mslSide *= -1;
          missiles.push({ x:shipX + mslSide*22, y:shipY+3,
            a: mslSide>0 ? -0.55 : Math.PI+0.55,     // out and over, then it turns in
            sp: 2.6, tgt: live[irnd(0,live.length-1)], life:170 });
        }
        mslCd = Math.max(11, 40 - mslTier()*6);
      } else mslCd = 8;                              // nothing to shoot at: check back soon
    }
  }
  // bomb
  if(bombRequest){ bombRequest=false;
    if(bombs>0 && state==='play'){
      bombs--; flash=14; shake=18; sfx.big();
      scorch(shipX, shipY-40, 185);
      ebullets=[];
      for(const e of enemies){
        if(e.type==='boss'){
          e.hp -= Math.max(25, e.hpMax*0.07);
          if(e.pods) for(const pd of e.pods) if(pd.hp>0) pd.hp -= pd.hpMax*0.07;
        } else {
          e.hp -= 9999;
          // a bomb is a panic button, not a farming tool: nothing it kills pays out
          e.drop = false;
          e.splits = false;
        }
        burst(e.x,e.y,['#ffffff','#ffd700'],6,3);
      }
      burst(shipX,shipY-60,['#ffffff','#ffd700','#ee1111','#28e0e0'],40,8);
    }
  }
}

// ---------- update ----------
function update(){
  frame++;
  pollPad();
  if(PAD.bomb)  bombRequest  = true;
  if(PAD.start) { if(state==='play') paused = !paused; else startRequest = true; }
  if(PAD.fire && state!=='play') startRequest = true;
  updateTerrain(state==='play' ? TERR_SPD : 0.8);
  if(state!=='play'){
    if(startRequest){ startRequest=false;
      if(state==='title'||state==='gameover'){ resetGame(); state='play'; }
    }
    // ambient shards decay on menus
    sweep(shards, s=>{s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;return --s.life>0;});
    return;
  }
  startRequest=false;
  if(paused) return;

  updatePlayer();

  // area progression
  if(!bossActive && shipDead===0){
    // brisker through the opening so the first two areas don't drag
    areaProg += 0.036 + Math.max(0, 3-area)*0.012;   // a1 ~28s, a2 ~35s, a3+ ~46s
    if(areaProg>=100 && !bossActive){
      areaProg=100;
      if(bossWarn===0) bossWarn=130;
    }
  }
  if(bossWarn>0){ bossWarn--; if(bossWarn===0) spawnBoss(); }

  // spawn small enemies
  if(!bossActive && bossWarn===0){
    if(--spawnCd<=0){ spawnEnemy(); spawnCd = Math.max(18, 45-area*2.2) + irnd(0,16); }
  }

  // shots
  sweep(shots, s=>{ s.x+=s.vx; s.y+=s.vy; return s.y>-20 && s.x>-10 && s.x<PW+10; });

  // enemies
  const LSPEC = laserSpec();
  for(const e of enemies){
    if(e.type==='orb'){ e.x+=e.vx; e.y+=e.vy;
      if(e.x<12||e.x>PW-12) e.vx*=-1;
      if(--e.cd<=0){ eShoot(e,'aim'); e.cd=fr(100)+irnd(0,30); }
    } else if(e.type==='redY'){ e.ph+=.05; e.x=e.base+Math.sin(e.ph)*70; e.y+=e.vy;
      if(--e.cd<=0){ eShoot(e, Math.random()<.5?'aim':'cyan'); e.cd=fr(90)+irnd(0,30); }
    } else if(e.type==='dart'){ e.x+=e.vx; e.y+=e.vy;
    } else if(e.type==='tank'){ e.x+=e.vx; e.y+=e.vy;
      if(e.x<20||e.x>PW-20) e.vx*=-1;
      if(--e.cd<=0){ eShoot(e,'cyan'); e.cd=fr(105)+irnd(0,25); }
    } else if(e.type==='hex'){          // cruiser: drifts, 3-round aimed bursts
      e.x+=e.vx; e.y+=e.vy;
      if(e.x<26||e.x>PW-26) e.vx*=-1;
      if(e.y>200) e.vy = -Math.abs(e.vy)*0.5;
      if(e.burst>0){ if(frame%7===0){ eShoot(e,'aim',0,14); e.burst--; } }
      else if(--e.cd<=0){ e.burst=3; e.cd=fr(110)+irnd(0,20); }
    } else if(e.type==='weaver'){
      /* Fires, then DASHES to a new station — eased, over about 20 frames, with
         a smear behind it. It used to snap straight to base+sin(ph)*190 the
         instant it reached station, which teleported it up to 190px sideways
         (often clean off the screen). */
      if(e.y < e.stopY){ e.y += e.vy; e.tx = e.x; e.ty = e.stopY; }
      else {
        // eased approach, but SPEED-CAPPED: a plain lerp toward a target 400px
        // away still lurches ~68px on its first frame, which reads as a blink
        const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
        if(d > 0.4){
          const step = Math.min(d, Math.min(8, d*0.17));
          e.x += dx/d*step; e.y += dy/d*step;
        }
        if(--e.cd<=0){
          eShoot(e,'spray',0,12);
          e.cd = fr(70)+irnd(0,22);
          e.tx = clamp(e.x + rnd(-190,190), 48, PW-48);   // a short hop, not a jump
          e.ty = clamp(e.y + rnd(-70,70), 48, 168);
        }
      }
      e.trail.unshift({x:e.x, y:e.y});
      if(e.trail.length > 7) e.trail.pop();
    } else if(e.type==='splitter'){ e.x+=e.vx; e.y+=e.vy;
      if(e.x<18||e.x>PW-18) e.vx*=-1;
      if(--e.cd<=0){ eShoot(e,'aim'); e.cd=fr(115)+irnd(0,25); }
    } else if(e.type==='turret'){       // parks and shells you
      if(e.y<e.stopY) e.y+=e.vy;
      e.ang = Math.atan2(shipY-e.y, shipX-e.x);
      if(e.y>=e.stopY-1){
        if(--e.cd<=0){ eShoot(e,'heavy',Math.cos(e.ang)*16,Math.sin(e.ang)*16); e.cd=fr(95)+irnd(0,20); }
        if(--e.cd2<=0){ eShoot(e,'ring'); e.cd2=fr(200)+irnd(0,40); }
      }
    } else if(e.type==='ship'){
      e.y += e.vy;                       // always carried along by the water
      if(!e.vert){                       // broadside: run in, then brake and hold
        const d = e.tx - e.x;
        if(Math.abs(d) > 4){ e.vx = Math.max(-3.4, Math.min(3.4, d*0.055)); e.x += e.vx; }
        else e.vx = 0;
      }
      for(const tu of e.turrets){
        tu.x = e.x + tu.ox; tu.y = e.y + tu.oy;
        if(tu.hp<=0 || tu.y < 6) continue;
        if(--tu.cd<=0){
          eShoot(e, Math.random()<.45 ? 'heavy' : 'aim', tu.ox, tu.oy);
          tu.cd = fr(90)+irnd(0,34);
        }
      }
    } else if(e.type==='boss'){
      bossUpdate(e);
    }
    // laser hit — the beam damages whatever it overlaps, harder at higher tiers
    if(laserOn && shipDead===0 && e.y<shipY){
      for(const pt of enemyParts(e)){
        if(Math.abs(pt.x-shipX) < LSPEC.w/2 + pt.r){
          if(pt.pod) pt.pod.hp -= LSPEC.dmg;
          else if(pt.turret) pt.turret.hp -= LSPEC.dmg;
          else if(!shielded(e)) e.hp -= LSPEC.dmg;
          if(frame%4===0) burst(pt.x+rnd(-8,8), pt.y+rnd(-8,8), [LSPEC.hot,'#ffffff'],1,2);
          break;
        }
      }
    }
  }
  for(const e of enemies) updateBank(e);

  // shot vs enemy (and vs boss sub-parts)
  for(const s of shots){
    for(const e of enemies){
      if(e.hp<=0) continue;
      let hit = null;
      for(const pt of enemyParts(e))
        if(dist2(s.x,s.y,pt.x,pt.y) < (pt.r+4)*(pt.r+4)){ hit = pt; break; }
      if(!hit) continue;
      s.dead = true;
      if(hit.pod){ hit.pod.hp -= s.dmg;
        if(hit.pod.hp<=0) burst(hit.x,hit.y,['#ffd700','#ffffff','#111111'],14,4);
        else { sfx.hit(); burst(s.x,s.y,['#ffffff'],2,2); }
      } else if(hit.turret){ hit.turret.hp -= s.dmg;
        if(hit.turret.hp<=0){ burst(hit.x,hit.y,['#ffd700','#ffffff','#2b3238'],16,4); sfx.boom(); }
        else { sfx.hit(); burst(s.x,s.y,['#ffffff'],2,2); }
      } else if(shielded(e)){          // hull/core is armoured until its guns go
        burst(s.x,s.y,['#8ad8f0'],3,2);
      } else {
        e.hp -= s.dmg;
        if(e.hp>0){ sfx.hit(); burst(s.x,s.y,['#ffffff'],2,2); }
      }
      // landing hits trickles the laser back, so a long boss fight has a rhythm:
      // shoot to build the gauge, spend it in bursts
      laserGauge = clamp(laserGauge + s.dmg*0.10, 0, 100);
      break;
    }
  }
  sweep(shots, s=>!s.dead);
  // cull / kill
  const keep=[];
  for(const e of enemies){
    if(e.hp<=0){ killEnemy(e); continue; }
    const pad = e.type==='ship' ? 210 : 60;
    if(e.y > H+70 || e.x < -pad || e.x > PW+pad) continue;
    // ram player — long or segmented enemies check their whole silhouette
    if(shipDead===0){
      if(e.type==='ship' || e.boss==='serpent'){
        for(const pt of enemyParts(e))
          if(dist2(pt.x,pt.y,shipX,shipY) < (pt.r+shipR)*(pt.r+shipR)){ hitPlayer(); break; }
      } else if(dist2(e.x,e.y,shipX,shipY) < (e.r+shipR)*(e.r+shipR)) hitPlayer();
    }
    keep.push(e);
  }
  enemies=keep;

  // enemy bullets
  sweep(ebullets, b=>{
    b.x+=b.vx; b.y+=b.vy;
    // the laser is a shield as well as a weapon: it eats what flies into it
    if(laserOn && shipDead===0 && b.y < shipY-6 && Math.abs(b.x-shipX) < LSPEC.w/2){
      if(frame%2===0) burst(b.x, b.y, [LSPEC.hot,'#ffffff'], 1, 1.6);
      return false;
    }
    if(shipDead===0 && inv<=0 && dist2(b.x,b.y,shipX,shipY) < (b.r+shipR)*(b.r+shipR)){
      hitPlayer(); return false;
    }
    return b.x>-15 && b.x<PW+15 && b.y>-15 && b.y<H+15;
  });

  // missiles
  sweep(missiles, m=>{
    if(!m.tgt || m.tgt.hp<=0 || !enemies.includes(m.tgt)){
      const live = enemies.filter(e=>e.y>-12 && e.y<H-16 && e.hp>0);
      m.tgt = live.length ? live[irnd(0,live.length-1)] : null;
    }
    if(m.tgt){                                   // turn-rate limited, so it arcs
      let d = Math.atan2(m.tgt.y-m.y, m.tgt.x-m.x) - m.a;
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      m.a += clamp(d, -0.105, 0.105);
    }
    m.sp = Math.min(7.4, m.sp + 0.17);
    m.x += Math.cos(m.a)*m.sp; m.y += Math.sin(m.a)*m.sp;
    if(frame%3===0) shards.push({x:m.x, y:m.y, vx:0, vy:0.35, rot:0, vr:0,
                                 size:2.2, col:'#ff9a30', life:8});
    for(const e of enemies){
      if(e.hp<=0) continue;
      let hit = null;
      for(const pt of enemyParts(e))
        if(dist2(m.x,m.y,pt.x,pt.y) < (pt.r+5)*(pt.r+5)){ hit = pt; break; }
      if(!hit) continue;
      if(hit.pod) hit.pod.hp -= 3;
      else if(hit.turret) hit.turret.hp -= 3;
      else if(!shielded(e)) e.hp -= 3;
      burst(m.x, m.y, ['#ffd090','#ffffff','#ff8020'], 7, 3);
      sfx.hit();
      return false;
    }
    return --m.life>0 && m.x>-40 && m.x<PW+40 && m.y>-40 && m.y<H+40;
  });

  // items
  sweep(items, it=>{
    it.y+=it.vy; it.ph+=.1;
    if(dist2(it.x,it.y,shipX,shipY) < 30*30 && shipDead===0){
      sfx.item();
      // safety net only — dropKind() already keeps bombs from spawning at full
      if(it.kind==='B' && bombs>=BOMBMAX) it.kind = Math.random()<0.5 ? 'L' : 'P';
      if(it.kind==='B'){ bombs=Math.min(bombs+1,BOMBMAX); addText(it.x,it.y,'BOMB','#ffd700'); }
      if(it.kind==='L'){
        const wasLv = laserLv(), wasOv = laserOver();
        laserXp++;
        laserGauge = clamp(laserGauge+40,0,100);
        if(laserLv()>wasLv){ addText(it.x,it.y,'LASER Lv'+laserLv(),'#ffffff'); flash=8; score+=1500; }
        else if(laserOver()>wasOv){ addText(it.x,it.y,'BEAM WIDE','#ffffff'); score+=1200; }
        else addText(it.x,it.y,'LASER','#ff44ff');
      }
      if(it.kind==='P'){
        const was = power;
        power = Math.min(power+1, GUNCAP);
        const label = was>=GUNCAP   ? 'BONUS'
                    : was>=GUNRAPID ? 'MISSILE'
                    : was>=GUNMAX   ? 'RAPID'
                    : power>=4      ? 'SPREAD' : 'POWER';
        addText(it.x,it.y, label,
                was>=GUNRAPID ? '#ff9a30' : was>=GUNMAX ? '#35e8e8'
                              : power>=4 ? '#ffee00' : '#28e0e0');
        score += was>=GUNCAP ? 1200 : was>=GUNMAX ? 900 : 500;
      }
      return false;
    }
    return it.y < H+20;
  });

  if(shockPending){ shockPending = false; shockwave(); }
  checkExtraLife();
  if(score>highScore){ highScore=score; saveHS(); }

  // shards & texts
  sweep(shards, s=>{ s.x+=s.vx; s.y+=s.vy; s.vx*=.96; s.vy*=.96; s.rot+=s.vr; return --s.life>0; });
  sweep(texts,  t=>{ t.y-=.6; return --t.life>0; });
  if(flash>0) flash--;
  if(shake>0) shake--;
  if(bannerT>0) bannerT--;
}

// ---------- drawing ----------
/* ROLL, not yaw — and done the way the original did it.
   The sprite behaves like flat 2D geometry rolled about its own forward axis and
   viewed orthographically from above. Project that and every horizontal distance
   scales by cos(theta) while vertical ones don't move at all: the craft simply
   narrows. No rotation (that would be yaw, swinging the nose away from where the
   guns fire) and no shear (that fakes a perspective this view doesn't have).
   Because the shadow pass runs the same code, the shadow narrows with it. */
const ROLLMAX = 0.85;                 // radians at full deflection (~49 degrees)
function roll(b){
  if(!b) return;
  g.scale(Math.cos(clamp(b,-1,1) * ROLLMAX), 1);
}
/* Enemy fighters lean differently, and the original is clear about it: their
   noses visibly swing toward the way they're sliding — that's yaw — with only a
   token bank on top. They can do that because they shoot at the player rather
   than straight down the screen, so a turned nose still points at what it's
   firing at. The player keeps pure roll for exactly the opposite reason.
   Enemy art faces DOWN (+y), so a positive lean needs a negative rotation to
   swing the nose to the right. */
const YAWMAX = 0.32, ELEAN = 0.45;    // ~18 degrees of yaw, ~10% of squash
function lean(b){
  if(!b) return;
  const k = clamp(b,-1,1);
  g.rotate(-k * YAWMAX);
  g.scale(Math.cos(k * ELEAN), 1);
}
/* Player craft scale. The sprite is authored at roughly 40x38 units; this is
   the multiplier that puts it on screen. Collision radius, muzzle offsets,
   the playfield clamp and the pickup reach all follow from it. */
const SHIPS = 1.5;
function drawShip(x,y,s,bank){
  g.save(); g.translate(x,y); g.scale(s,s);
  roll(bank);
  /* Vectorised straight off the player's own trace of the original sprite, then
     mirrored about the centreline so it is exactly symmetric. Two flat colours,
     hard edges, no gradients and no AA-soft outlines — same as everything else
     on screen. Pink body: pointed nose, a shoulder flare, low swept wings with
     blunt square tips, and a flat-bottomed tail between them. Cyan core: an M —
     two peaks either side of the nose, notched at the top, splitting into two
     legs at the bottom. */
  poly([[0,-19.0],[-5.3,-9.3],[-10.9,-7.5],[-10.3,-5.3],[-12.0,7.5],
        [-19.9,10.5],[-19.9,16.6],[-10.9,18.8],[-6.1,11.4],[-3.5,11.4],
        [-1.2,16.1],[1.2,16.1],[3.5,11.4],[6.1,11.4],[10.9,18.8],
        [19.9,16.6],[19.9,10.5],[12.0,7.5],[10.3,-5.3],[10.9,-7.5],
        [5.3,-9.3]], '#f5b0a9');
  poly([[-5.4,-9.4],[-10.9,-7.5],[-5.9,11.3],[-3.6,11.3],[0,-0.5],
        [3.6,11.3],[5.9,11.3],[10.9,-7.5],[5.4,-9.4],[0,-5.2]], '#02fdff');
  g.restore();
}
function drawEnemy(e){
  g.save(); g.translate(e.x,e.y);
  lean(e.bank);                       // yaw into the slide, slight bank
  if(e.type==='orb'){
    g.fillStyle = col('#28e0e0'); g.beginPath();
    for(let i=0;i<8;i++){ const a=Math.PI/8 + i*Math.PI/4;
      const px=Math.cos(a)*e.r, py=Math.sin(a)*e.r;
      i?g.lineTo(px,py):g.moveTo(px,py); }
    g.closePath(); g.fill();
  } else if(e.type==='redY'){
    /* Matched to the original: a green fuselage standing proud above a red Y —
       two thick swept arms meeting a spine that runs down to the nose — with a
       green flash tucked under each arm root. ~30% bigger than it used to be. */
    poly([[-6,-18],[6,-18],[7,-7],[4,0],[0,5],[-4,0],[-7,-7]], '#00cc44');
    poly([[-17,-11],[-5,-4],[0,2],[5,-4],[17,-11],[12,-4],[4,5],[4,12],
          [0,18],[-4,12],[-4,5],[-12,-4]], '#ee1111');
    poly([[-11,0],[-5,6],[-11,7]], '#00cc44');
    poly([[11,0],[5,6],[11,7]], '#00cc44');
  } else if(e.type==='dart'){
    poly([[0,13],[9,-9],[-9,-9]], '#ffffff');
    poly([[0,6],[4,-5],[-4,-5]], '#cc2222');
  } else if(e.type==='tank'){
    // armoured hauler. It used to be a gold diamond with a red B on it, which is
    // exactly what the bomb PICKUP looks like — misread as an item every time.
    poly([[-18,-7],[-12,-13],[12,-13],[18,-7],[18,4],[-18,4]], '#8a8f96');
    poly([[-18,4],[18,4],[13,12],[-13,12]], '#5c6169');
    g.fillStyle = col('#ffd700'); g.fillRect(-16,-4,9,11); g.fillRect(7,-4,9,11);
    g.fillStyle = col('#c9a520'); g.fillRect(-16,4,9,3);  g.fillRect(7,4,9,3);
    g.fillStyle = col('#2b3238'); g.fillRect(-6,-13,12,17);
    g.fillStyle = col('#ee1111'); g.fillRect(-5,-11,10,4);
    g.fillStyle = col('#ffb0b0'); g.fillRect(-3,-10,5,2);
  } else if(e.type==='hex'){
    // heavy cruiser: steel hex hull, cyan panels, red eye
    const R=23; const pts=[];
    for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; pts.push([Math.cos(a)*R,Math.sin(a)*R]); }
    poly(pts,'#3d5e72');
    poly([[-R*.62,-6],[R*.62,-6],[R*.42,-16],[-R*.42,-16]], '#8ad8f0');
    poly([[-R*.62,6],[R*.62,6],[R*.42,16],[-R*.42,16]], '#28506a');
    g.fillStyle = col('#ee1111'); g.beginPath(); g.ellipse(0,0,7,4.5,0,0,7); g.fill();
    g.fillStyle = col('#ffb0b0'); g.beginPath(); g.ellipse(-2,-1,2.6,1.7,0,0,7); g.fill();
  } else if(e.type==='weaver'){
    // magenta skimmer with swept wings; smears while it dashes
    if(e.trail && e.trail.length>4){
      const sp = Math.hypot(e.x-e.trail[4].x, e.y-e.trail[4].y);
      if(sp > 14){
        for(const k of [4,6]){
          const t = e.trail[k]; if(!t) continue;
          g.save(); g.globalAlpha = k===4 ? 0.28 : 0.13;
          g.translate(t.x-e.x, t.y-e.y);
          poly([[0,-16],[9,10],[-9,10]], '#ff42d2');
          g.restore();
        }
        g.globalAlpha = 1;
      }
    }
    poly([[0,16],[19,-6],[7,-2]], '#ff42d2');
    poly([[0,16],[-19,-6],[-7,-2]], '#c02a9e');
    poly([[0,-16],[9,10],[-9,10]], '#ff6ade');
    poly([[0,-8],[4,6],[-4,6]], '#ffffff');
    g.fillStyle = col('#111'); g.fillRect(-11,8,4,5); g.fillRect(7,8,4,5);
  } else if(e.type==='splitter'){
    // green diamond with a seam it will break along
    poly([[0,-16],[15,0],[0,16],[-15,0]], '#00cc44');
    poly([[0,-16],[15,0],[0,16]], '#00a838');
    g.strokeStyle = col('#ffffff'); g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,-16); g.lineTo(0,16); g.stroke();
    g.fillStyle = col('#111'); g.beginPath(); g.arc(0,0,4,0,7); g.fill();
  } else if(e.type==='turret'){
    // parked gun platform, barrel tracking you
    g.save(); g.rotate(e.ang===undefined?0:e.ang-Math.PI/2);
    g.fillStyle = col('#777'); g.fillRect(-6,0,12,26);
    g.fillStyle = col('#aaa'); g.fillRect(-3,0,6,26);
    g.restore();
    const R=24, pts=[];
    for(let i=0;i<8;i++){ const a=Math.PI/8+i*Math.PI/4; pts.push([Math.cos(a)*R,Math.sin(a)*R]); }
    poly(pts,'#555');
    poly(pts.map(q=>[q[0]*.66,q[1]*.66]),'#8a8a92');
    g.fillStyle = col('#ffd700'); g.beginPath(); g.arc(0,0,7,0,7); g.fill();
    g.fillStyle = col('#ee1111'); g.beginPath(); g.arc(0,0,3.4,0,7); g.fill();
  } else if(e.type==='ship'){
    /* Drawn once, bow to +x. The vertical variant is the same hull turned a
       quarter turn so its bow points up-screen, the way it's actually sailing.
       Turrets and the hp bar are drawn in world space by drawShipParts(). */
    if(e.vert) g.rotate(-Math.PI/2); else g.scale(e.face, 1);
    poly([[-74,-24],[52,-24],[86,0],[52,24],[-74,24],[-82,0]], '#4e5a63');
    poly([[-74,-24],[52,-24],[86,0],[60,-8],[-78,-8]], '#6d7c88');
    g.fillStyle = col('#2b3238'); g.fillRect(-68,-4,132,8);
    g.fillStyle = col('#39434b'); g.fillRect(-68,14,124,5);
    poly([[-20,-24],[16,-24],[12,-37],[-16,-37]], '#8d9aa6');    // superstructure
    poly([[-20,-24],[16,-24],[12,-31],[-16,-31]], '#aab6c2');
    g.fillStyle = col('#ee1111'); g.fillRect(-9,-35,14,4);
    g.fillStyle = col('#ffd0d0'); g.fillRect(-7,-34,7,2);
    g.fillStyle = col('#39434b'); g.fillRect(-52,-22,11,9); g.fillRect(34,-22,11,9);
    g.fillStyle = col('#8d9aa6'); g.fillRect(-30,-34,7,11);             // mast
  } else if(e.type==='boss'){
    drawBoss(e);
  }
  g.restore();
}
/* Turrets and the hull bar live in world space: the barrels track you
   independently of the hull's orientation, and the bar must stay level. */
function drawMissile(m){
  g.save(); g.translate(m.x, m.y); g.rotate(m.a);
  g.fillStyle = col('#ff9a30'); g.fillRect(-8,-1.6,5,3.2);
  poly([[7,0],[-4,-3.4],[-4,3.4]], '#e8f0ff');
  poly([[2,0],[-3,-1.8],[-3,1.8]], '#35d8e8');
  g.restore();
}
function drawShipParts(e){
  if(e.type!=='ship') return;
  for(const tu of e.turrets){
    if(tu.hp<=0){                                   // burnt-out stub
      g.save(); g.translate(tu.x,tu.y);
      g.fillStyle = col('#2b3238'); g.beginPath(); g.arc(0,0,12,0,7); g.fill();
      g.fillStyle = col('#14181c'); g.fillRect(-8,-3,16,6);
      g.fillStyle = col('#5a3020'); g.fillRect(-4,-9,8,5);
      g.restore(); continue;
    }
    const a = Math.atan2(shipY-tu.y, shipX-tu.x);
    g.save(); g.translate(tu.x,tu.y);
    g.save(); g.rotate(a-Math.PI/2);
    g.fillStyle = col('#8d9aa6'); g.fillRect(-5,0,10,27);
    g.fillStyle = col('#c9d2da'); g.fillRect(-2,0,4,27);
    g.fillStyle = col('#2b3238'); g.fillRect(-5,23,10,4);
    g.restore();
    g.fillStyle = col('#6d7c88'); g.beginPath(); g.arc(0,0,15,0,7); g.fill();
    g.fillStyle = col('#3d4750'); g.beginPath(); g.arc(0,0,10,0,7); g.fill();
    g.fillStyle = col('#ffd700'); g.beginPath(); g.arc(0,0,5,0,7); g.fill();
    g.restore();
    if(!SH){
      g.fillStyle='#111';    g.fillRect(tu.x-13, tu.y-24, 26, 3);
      g.fillStyle='#ffd700'; g.fillRect(tu.x-13, tu.y-24, 26*Math.max(0,tu.hp)/tu.hpMax, 3);
    }
  }
  const half = e.vert ? 76 : 90;                    // bar sits clear of the bow
  g.fillStyle = col('#111'); g.fillRect(e.x-48, e.y-half, 96, 5);
  g.fillStyle = col(gunsLeft(e) ? '#4c5a66' : '#ee1111');
  g.fillRect(e.x-48, e.y-half, 96*Math.max(0,e.hp)/e.hpMax, 5);
}
/* ---- five boss silhouettes --------------------------------------------- */
function drawBoss(e){
  const K = e.boss;
  if(K==='tri'){
    poly([[-52,-40],[-6,-40],[-30,26]], '#35d8e8');
    poly([[52,-40],[6,-40],[30,26]], '#0899aa');
    poly([[-34,-40],[34,-40],[0,52]], '#00cc44');
    poly([[-26,-40],[26,-40],[18,-14],[-18,-14]], '#111111');
    poly([[-13,-34],[13,-34],[0,-16]], '#ee1111');
  } else if(K==='hive'){
    // wide carrier with open launch bays
    poly([[-92,-26],[92,-26],[70,20],[-70,20]], '#6a5a2a');
    poly([[-92,-26],[92,-26],[80,-12],[-80,-12]], '#a8912f');
    for(let i=-2;i<=2;i++){                       // honeycomb cells
      const cx=i*30, R=13, pts=[];
      for(let k=0;k<6;k++){ const a=Math.PI/6+k*Math.PI/3; pts.push([cx+Math.cos(a)*R, 0+Math.sin(a)*R]); }
      poly(pts, i%2 ? '#ffd700' : '#c9a520');
    }
    poly([[-40,20],[40,20],[26,42],[-26,42]], '#111111');
    poly([[-16,20],[16,20],[0,44]], '#ee1111');   // exposed core
    g.fillStyle = col('#28e0e0'); g.fillRect(-84,-24,18,8); g.fillRect(66,-24,18,8);
  } else if(K==='orbital'){
    // crown core, with its orbiting pods drawn in world space by the caller
    const R=34, pts=[];
    for(let i=0;i<8;i++){ const a=i*Math.PI/4; pts.push([Math.cos(a)*R,Math.sin(a)*R]); }
    poly(pts, podsLeft(e) ? '#4a4a7a' : '#8a2a2a');
    poly(pts.map(q=>[q[0]*.62,q[1]*.62]), podsLeft(e) ? '#7a7ab8' : '#ee1111');
    g.fillStyle = col(podsLeft(e) ? '#28e0e0' : '#ffee66');
    g.beginPath(); g.arc(0,0,11,0,7); g.fill();
    if(podsLeft(e)){                              // shield shimmer
      if(!SH){
        g.strokeStyle='rgba(40,224,224,'+(0.35+0.25*Math.sin(frame*0.2))+')';
        g.lineWidth=2; g.beginPath(); g.arc(0,0,R+8,0,7); g.stroke();
      }
    }
  } else if(K==='serpent'){
    poly([[-22,-16],[22,-16],[0,26]], '#00a860');   // head
    poly([[-15,-16],[15,-16],[0,14]], '#3ce89a');
    g.fillStyle = col('#ee1111');
    g.beginPath(); g.arc(-8,-6,4,0,7); g.fill();
    g.beginPath(); g.arc(8,-6,4,0,7); g.fill();
    poly([[-22,-16],[-30,-30],[-10,-20]], '#00a860');
    poly([[22,-16],[30,-30],[10,-20]], '#00a860');
  } else if(K==='fortress'){
    poly([[-120,-34],[120,-34],[104,14],[-104,14]], '#4a4f5a');
    poly([[-120,-34],[120,-34],[110,-22],[-110,-22]], '#79808f');
    for(const gx of [-52,0,52]){                   // gun ports
      poly([[gx-16,14],[gx+16,14],[gx+11,34],[gx-11,34]], '#22252c');
      g.fillStyle = col((frame%50<25) ? '#ee44aa' : '#7a2050');
      g.fillRect(gx-6, 20, 12, 12);
    }
    poly([[-30,-34],[30,-34],[18,-6],[-18,-6]], '#111111');
    poly([[-15,-30],[15,-30],[0,-10]], '#ee1111');
  }
  // hp bar
  if(SH) return;
  const bw = K==='fortress' ? 116 : K==='hive' ? 94 : 80;
  g.fillStyle='#111'; g.fillRect(-bw/2,-e.r-16,bw,5);
  g.fillStyle='#ee1111'; g.fillRect(-bw/2,-e.r-16,bw*Math.max(0,e.hp)/e.hpMax,5);
}
/* pods live in world space, so they're drawn outside the boss transform */
function drawPods(e){
  if(e.boss!=='orbital') return;
  for(const pd of e.pods){
    if(pd.hp<=0) continue;
    g.save(); g.translate(pd.x, pd.y); g.rotate(frame*0.04);
    poly([[0,-17],[15,9],[-15,9]], '#ffd700');
    poly([[0,-9],[8,6],[-8,6]], '#ee1111');
    g.restore();
    if(!SH){
      g.fillStyle='#111'; g.fillRect(pd.x-14, pd.y-24, 28, 3);
      g.fillStyle='#ffd700'; g.fillRect(pd.x-14, pd.y-24, 28*Math.max(0,pd.hp)/pd.hpMax, 3);
    }
  }
}
/* the serpent's body is a chain of shrinking segments along the head's path */
function drawSegs(e){
  if(e.boss!=='serpent' || !e.segs) return;
  for(let i=e.segs.length-1;i>=0;i--){
    const sg=e.segs[i], t=1-i/(e.segs.length+2), r=8+7*t;
    g.save(); g.translate(sg.x,sg.y);
    poly([[0,-r],[r,r*0.8],[-r,r*0.8]], i%2 ? '#00a860' : '#0d8a52');
    poly([[0,-r*0.55],[r*0.5,r*0.4],[-r*0.5,r*0.4]], '#7cf0bc');
    g.restore();
  }
}
function drawHUD(){
  g.fillStyle='#2929c8'; g.fillRect(PW,0,W-PW,H);
  g.strokeStyle='#000'; g.lineWidth=2; g.strokeRect(PW,0,W-PW,H);
  const lx = PW+14;
  g.textAlign='left';
  g.font='italic bold 17px Georgia, serif';
  g.fillStyle='#35e8e8'; g.fillText('HIGH SCORE', lx, 34);
  g.fillStyle='#fff'; g.textAlign='right'; g.font='italic bold 16px Georgia, serif';
  g.fillText(''+highScore, W-14, 54);
  g.textAlign='left'; g.fillStyle='#35e8e8'; g.font='italic bold 17px Georgia, serif';
  g.fillText('SCORE', lx, 96);
  g.fillStyle='#fff'; g.textAlign='right'; g.font='italic bold 16px Georgia, serif';
  g.fillText(''+score, W-14, 116);
  g.textAlign='left'; g.fillStyle='#35e8e8'; g.font='italic bold 17px Georgia, serif';
  g.fillText('LEFT', lx, 158);
  const spare = Math.max(0, lives);
  if(spare <= 3){
    for(let i=0;i<spare;i++) drawShip(lx+12+i*26, 178, .55);
  } else {                             // one icon and a count, so it can't overrun
    drawShip(lx+12, 178, .55);
    g.font='italic bold 17px Georgia, serif'; g.fillStyle='#ffffff';
    g.fillText('x'+spare, lx+30, 184);
  }
  g.fillStyle='#35e8e8'; g.fillText('BOMB', lx, 218);
  for(let i=0;i<bombs;i++){
    const bx=lx+12+i*26, by=238;
    poly([[bx,by-10],[bx+10,by],[bx,by+10],[bx-10,by]], '#ffd700');
    g.fillStyle='#ee1111'; g.font='bold 11px Georgia, serif'; g.textAlign='center';
    g.fillText('B', bx, by+4); g.textAlign='left';
  }
  const LH = laserSpec();
  g.font='italic bold 13px Georgia, serif'; g.fillStyle='#35e8e8';
  g.fillText('LASER', lx, 302);
  g.fillStyle = LH.col;
  g.fillText('Lv'+laserLv() + (laserOver() ? '+'+laserOver() : ''), lx+56, 302);
  g.strokeStyle = laserLock ? '#ee4444' : '#35e8e8';
  g.lineWidth=1.5; g.strokeRect(lx, 310, 108, 16);
  g.fillStyle = laserLock ? (frame%20<10 ? '#8a3838' : '#5e2626') : LH.col;
  g.fillRect(lx+2, 312, 104*laserGauge/100, 12);
  if(laserLock){                      // reads across the meter it refers to
    g.font='italic bold 10px Georgia, serif';
    g.fillStyle = frame%40<24 ? '#ffdcdc' : '#e08a8a';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('RECHARGING', lx+54, 318);      // bar spans 310..326
    g.textAlign='left'; g.textBaseline='alphabetic';
  }
  // ---- gun: five pattern pips plus the single rate-of-fire step ----
  g.font='italic bold 13px Georgia, serif'; g.fillStyle='#35e8e8';
  g.fillText('GUN', lx, 262);
  for(let i=0;i<GUNMAX;i++){
    g.fillStyle = i<power ? (power>=4?'#ffee00':'#ffffff') : '#1a1a7a';
    g.fillRect(lx+46+i*12, 252, 8, 11);
  }
  g.fillStyle = power>GUNMAX ? '#35e8e8' : '#1a1a7a';
  g.fillRect(lx+46+GUNMAX*12+3, 252, 8, 11);
  // ---- missiles ----
  g.font='italic bold 13px Georgia, serif';
  g.fillStyle = mslTier() ? '#35e8e8' : '#1f2a8a';
  g.fillText('MSL', lx, 282);
  for(let i=0;i<MSLMAX;i++){
    g.fillStyle = i<mslTier() ? '#ff9a30' : '#1a1a7a';
    g.fillRect(lx+46+i*12, 272, 8, 11);
  }
  g.fillStyle='#35e8e8'; g.fillText('AREA', lx, 352);
  // area scale
  g.strokeStyle='#35e8e8'; g.beginPath(); g.moveTo(lx,384); g.lineTo(lx+110,384); g.stroke();
  g.font='italic bold 11px Georgia, serif';
  const marks=[0,25,50,75,100];
  for(let i=0;i<5;i++){
    const mx=lx+i*27.5;
    g.beginPath(); g.moveTo(mx,380); g.lineTo(mx,388); g.stroke();
    g.textAlign='center'; g.fillText(''+marks[i], mx, 402);
  }
  g.textAlign='left';
  drawShip(lx + clamp(areaProg,0,100)*1.1, 374, .4);
  g.font='italic bold 13px Georgia, serif'; g.fillStyle='#35e8e8';
  g.fillText('AREA '+area, lx, 428);
  g.font='italic bold 11px Georgia, serif'; g.fillStyle='#ffd700';
  g.fillText(bioCur.name, lx, 444);
  if(bossActive && bossName){
    g.font='italic bold 11px Georgia, serif'; g.fillStyle='#ee5555';
    g.fillText(bossName, lx, 460);
  }
  // sound toggle
  g.font='italic bold 13px Georgia, serif';
  g.fillStyle = soundOn ? '#ffd700' : '#cc4444';
  g.textAlign='right'; g.fillText('Sound:'+(soundOn?'on':'off'), W-10, H-10);
  g.textAlign='left';
}
function draw(){
  g.setTransform(SCALE,0,0,SCALE,0,0);
  g.save();
  if(shake>0) g.translate(rnd(-shake,shake)*.4, rnd(-shake,shake)*.4);
  drawTerrain();

  // ---- drop shadows: one solid-black pass under everything ----
  if(state==='play' || state==='gameover'){
    g.save(); g.translate(SHX, SHY); SH = true;
    for(const e of enemies){
      if(!castsShadow(e)) continue;
      if(e.type==='boss') drawSegs(e);
      drawEnemy(e);
      if(e.type==='boss') drawPods(e);
    }
    for(const m of missiles) drawMissile(m);
    if(state==='play' && shipDead===0 && (inv<=0 || frame%6<3)) drawShip(shipX,shipY,SHIPS,shipBank);
    SH = false; g.restore();
  }

  // items
  for(const it of items){
    const c = it.kind==='B'?'#ffd700':it.kind==='L'?'#ee22cc':'#28e0e0';
    const w = 10+Math.sin(it.ph)*2;
    poly([[it.x,it.y-w],[it.x+w,it.y],[it.x,it.y+w],[it.x-w,it.y]], c);
    g.fillStyle = it.kind==='B'?'#ee1111':'#fff';
    g.font='bold 11px Georgia, serif'; g.textAlign='center';
    g.fillText(it.kind, it.x, it.y+4); g.textAlign='left';
  }
  // laser beam — widens and changes colour as it tiers up
  if(laserOn && shipDead===0 && state==='play'){
    const L = laserSpec(), lv = laserLv();
    const bw = L.w + Math.sin(frame*.8)*6;
    if(lv>=3){                                   // outer fringe on the high tiers
      g.globalAlpha=0.35; g.fillStyle=L.col;
      g.fillRect(shipX-bw*0.72, 0, bw*1.44, shipY-15); g.globalAlpha=1;
    }
    g.fillStyle=L.col; g.fillRect(shipX-bw/2, 0, bw, shipY-15);
    g.fillStyle=L.hot; g.fillRect(shipX-bw/6, 0, bw/3, shipY-15);
    if(lv>=4){                                   // plasma crackle
      g.fillStyle='#ffffff';
      for(let i=0;i<5;i++){
        const yy = ((frame*11 + i*97) % (shipY|1));
        g.fillRect(shipX-bw/2 + rnd(0,bw), yy, 2, 8);
      }
    }
  }
  // player shots: white lines low, yellow spread once you're powered up
  for(const s of shots){
    g.strokeStyle = s.col; g.lineWidth = s.w;
    g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - s.vx*1.3, s.y + 14); g.stroke();
  }
  // missiles
  for(const m of missiles) drawMissile(m);
  // enemies (boss sub-parts sit outside the body transform)
  for(const e of enemies) if(e.type==='boss') drawSegs(e);
  for(const e of enemies) drawEnemy(e);
  for(const e of enemies) if(e.type==='boss') drawPods(e);
  for(const e of enemies) if(e.type==='ship') drawShipParts(e);
  // ship
  if(state==='play' && shipDead===0 && (inv<=0 || frame%6<3)) drawShip(shipX,shipY,SHIPS,shipBank);
  // enemy bullets
  for(const b of ebullets){ g.fillStyle=b.col; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fill(); }
  /* Shards, rotated by hand. A big explosion puts 200+ of these on screen and
     the old loop did save/translate/rotate/restore PER SHARD — 800 canvas state
     operations a frame for three triangles' worth of pixels. Rotating the three
     points arithmetically costs one sin and one cos each and touches no state. */
  for(const s of shards){
    const z = s.size*(s.life/40+.4), cs = Math.cos(s.rot), sn = Math.sin(s.rot);
    g.fillStyle = col(s.col);
    g.beginPath();
    g.moveTo(s.x +  z*sn,           s.y -  z*cs);
    g.lineTo(s.x + (z*.8*cs - z*.6*sn), s.y + (z*.8*sn + z*.6*cs));
    g.lineTo(s.x + (-z*.8*cs - z*.6*sn), s.y + (-z*.8*sn + z*.6*cs));
    g.closePath(); g.fill();
  }
  // floating texts
  g.font='bold 12px Georgia, serif'; g.textAlign='center';
  for(const t of texts){ g.globalAlpha=Math.min(1,t.life/25); g.fillStyle=t.col; g.fillText(t.str,t.x,t.y); }
  g.globalAlpha=1; g.textAlign='left';
  // bomb flash
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash/16)+')'; g.fillRect(0,0,PW,H); }
  // biome banner
  if(bannerT>0 && banner){
    g.globalAlpha = Math.min(1, bannerT/40);
    g.textAlign='center'; g.font='italic bold 26px Georgia, serif';
    g.fillStyle='#000'; g.fillText(banner, PW/2+2, 92);
    g.fillStyle='#ffffff'; g.fillText(banner, PW/2, 90);
    g.globalAlpha=1; g.textAlign='left';
  }
  // boss warning
  if(bossWarn>0 && frame%30<18){
    g.font='italic bold 30px Georgia, serif'; g.fillStyle='#ee1111'; g.textAlign='center';
    g.fillText('!! WARNING !!', PW/2, H/2-20);
    if(bossName){ g.font='italic bold 18px Georgia, serif'; g.fillStyle='#ffd700';
      g.fillText(BOSSNAME[BOSSES[(area-1)%BOSSES.length]], PW/2, H/2+10); }
    g.textAlign='left';
  }
  g.restore();
  drawHUD();

  if(state==='title'){
    g.fillStyle='rgba(0,0,40,0.55)'; g.fillRect(0,0,PW,H);
    g.textAlign='center';
    g.font='italic bold 52px Georgia, serif';
    g.fillStyle='#000'; g.fillText('AREA FLAT 3', PW/2+3, 153);
    g.fillStyle='#35e8e8'; g.fillText('AREA FLAT 3', PW/2, 150);
    g.font='italic bold 16px Georgia, serif'; g.fillStyle='#ffd700';
    g.fillText('— browser revival —', PW/2, 180);
    drawShip(PW/2, 240, SHIPS*1.5);
    g.font='13px monospace'; g.fillStyle='#fff';
    const lines=[
      'MOUSE: move · left=shot · right=laser · middle=bomb',
      'KEYS : arrows/WASD move · Z shot · X laser · B bomb',
      'PAD  : stick move · A shot · X laser · B bomb',
      'M: sound on/off    P: pause    Esc: arcade',
      ''];
    lines.forEach((l,i)=>g.fillText(l, PW/2, 292+i*20));
    if(frame%60<40){ g.fillStyle='#ffee00'; g.fillText('CLICK or PRESS Z TO START', PW/2, 412); }
    g.textAlign='left';
  }
  if(state==='gameover'){
    g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,PW,H);
    g.textAlign='center';
    g.font='italic bold 46px Georgia, serif'; g.fillStyle='#ee1111';
    g.fillText('GAME OVER', PW/2, 200);
    g.font='italic bold 18px Georgia, serif'; g.fillStyle='#fff';
    g.fillText('SCORE  '+score, PW/2, 250);
    if(score>=highScore && score>0){ g.fillStyle='#ffd700'; g.fillText('NEW HIGH SCORE!', PW/2, 280); }
    g.font='13px monospace'; g.fillStyle='#fff';
    if(frame%60<40) g.fillText('CLICK or PRESS Z TO RESTART', PW/2, 330);
    g.textAlign='left';
  }
  if(paused && state==='play'){
    g.fillStyle='rgba(0,0,0,0.4)'; g.fillRect(0,0,PW,H);
    g.font='italic bold 34px Georgia, serif'; g.fillStyle='#fff'; g.textAlign='center';
    g.fillText('PAUSE', PW/2, H/2); g.textAlign='left';
  }
}

// ---------- main loop ----------
initTerrain();
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
